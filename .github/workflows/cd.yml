name: CD

on:
  push:
    branches:
      - main
      - dev
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || github.ref == 'refs/heads/test' && 'Test' || 'Development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore & Publish
        run: |
          dotnet restore
          dotnet publish -c Release -o ${{ runner.temp }}/publish

      - name: Deploy to Azure Web App (requires AZURE_WEBAPP_NAME & AZURE_PUBLISH_PROFILE secret)
        if: secrets.AZURE_PUBLISH_PROFILE != '' && secrets.AZURE_WEBAPP_NAME != ''
        uses: azure/webapps-deploy@v4
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/publish

      - name: Upload artifact (fallback)
        if: secrets.AZURE_PUBLISH_PROFILE == '' || secrets.AZURE_WEBAPP_NAME == ''
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: ${{ runner.temp }}/publish
